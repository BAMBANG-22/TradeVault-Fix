name: Deploy Supabase Edge Function (tradevault-api)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-edge.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy tradevault-api Edge Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase deployment configuration
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN belum diatur di GitHub Secrets. Lewati deploy otomatis Edge Function."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_REF="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$PROJECT_REF" ] && [ -n "${VITE_SUPABASE_URL:-}" ]; then
            PROJECT_REF="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E -n 's#^https?://([^./]+)\.supabase\.co.*#\1#p')"
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "::notice::VITE_SUPABASE_URL / SUPABASE_PROJECT_REF tidak ditemukan di GitHub Secrets. Lewati deploy otomatis."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy tradevault-api Edge Function
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy tradevault-api \
            --project-ref "${{ steps.preflight.outputs.project_ref }}" \
            --no-verify-jwt \
            --yes
