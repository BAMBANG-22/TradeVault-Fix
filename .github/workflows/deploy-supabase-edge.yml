name: Deploy Supabase Edge Function (tradevault-api)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-edge.yml'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy tradevault-api Edge Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Supabase deployment configuration
        id: preflight
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "${SUPABASE_ACCESS_TOKEN:-}" | tr -d '[:space:]')"
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN belum diatur di GitHub Secrets. Lewati deploy otomatis Edge Function."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$CLEAN_TOKEN" =~ ^sbp_ ]]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN di GitHub Secrets bukan Personal Access Token Supabase (harus diawali 'sbp_...'). Jangan isi dengan anon key / service_role key. Buat token di https://supabase.com/dashboard/account/tokens lalu perbarui GitHub Secret SUPABASE_ACCESS_TOKEN."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_REF="${SUPABASE_PROJECT_REF:-}"
          if [ -z "$PROJECT_REF" ] && [ -n "${VITE_SUPABASE_URL:-}" ]; then
            PROJECT_REF="$(printf '%s' "$VITE_SUPABASE_URL" | sed -E -n 's#^https?://([^./]+)\.supabase\.co.*#\1#p')"
          fi
          if [ -z "$PROJECT_REF" ]; then
            PROJECT_REF="hhotzotsdhkgymgtwfdk"
          fi

          HTTP_STATUS="$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $CLEAN_TOKEN" "https://api.supabase.com/v1/projects")"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN tidak valid atau sudah kedaluwarsa (HTTP $HTTP_STATUS dari api.supabase.com). Buat Personal Access Token baru ('sbp_...') di https://supabase.com/dashboard/account/tokens lalu simpan ke GitHub Secret SUPABASE_ACCESS_TOKEN."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        if: steps.preflight.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy tradevault-api Edge Function
        if: steps.preflight.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy tradevault-api \
            --project-ref "${{ steps.preflight.outputs.project_ref }}" \
            --no-verify-jwt \
            --yes
